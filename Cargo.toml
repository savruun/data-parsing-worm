[package]
name = "data-parsing-worm"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "A larvae worm: require .json and .toml files as typed Luau modules"

[[bin]]
name = "data-parsing-worm"
path = "src/main.rs"

[dependencies]
larvae-worm = { version = "0.7", features = ["native"] }

serde_json = "1"
toml = "0.9"
